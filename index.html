<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BITshare 导航</title>
    <link rel="icon" type="image/svg+xml" href="logo_best.svg">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@100..900&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo-container">
                <img src="logo_best.svg" alt="BITshare Logo" class="logo">
                <h1 class="site-title">BITshare</h1>
            </div>
            <p class="site-subtitle">开源 · 共享</p>
        </header>

        <main class="cards-container">
            <a href="http://10.170.35.57:13830" class="card card-orange" target="_blank">
                <div class="card-content">
                    <div class="card-icon">
                        <!-- Icon placeholder or SVG -->
                        <svg viewBox="0 0 24 24" width="48" height="48">
                            <path fill="currentColor" d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/>
                        </svg>
                    </div>
                    <h2 class="card-title">Openlist 站点</h2>
                    <p class="card-description">Openlist现已迁移至新站点，欢迎下载&分享此站点！</p>
                </div>
                <div class="card-action">
                    <span>访问站点</span>
                    <svg class="arrow-icon" viewBox="0 0 24 24" width="24" height="24">
                        <path fill="currentColor" d="M16.01 11H4v2h12.01v3L20 12l-3.99-4z"/>
                    </svg>
                </div>
            </a>

            <a href="http://site-2.teclab.org.cn:8888/" class="card card-green" target="_blank">
                <div class="card-content">
                    <div class="card-icon">
                        <svg viewBox="0 0 24 24" width="48" height="48">
                            <path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
                        </svg>
                    </div>
                    <h2 class="card-title">Java 站点</h2>
                    <p class="card-description">Java站点，现在处于测试阶段，完善后将全部迁移至此站点，欢迎帮助我们测试（如有建议可以加下方QQ群）！</p>
                </div>
                <div class="card-action">
                    <span>访问站点</span>
                    <svg class="arrow-icon" viewBox="0 0 24 24" width="24" height="24">
                        <path fill="currentColor" d="M16.01 11H4v2h12.01v3L20 12l-3.99-4z"/>
                    </svg>
                </div>
            </a>

            <a href="http://site-2.teclab.org.cn:8889/" class="card card-yellow" target="_blank">
                <div class="card-content">
                    <div class="card-icon">
                        <svg viewBox="0 0 24 24" width="48" height="48">
                            <path fill="currentColor" d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/>
                        </svg>
                    </div>
                    <h2 class="card-title">上传站点</h2>
                    <p class="card-description">在此站点上传你的资料，欢迎贡献！</p>
                </div>
                <div class="card-action">
                    <span>访问站点</span>
                    <svg class="arrow-icon" viewBox="0 0 24 24" width="24" height="24">
                        <path fill="currentColor" d="M16.01 11H4v2h12.01v3L20 12l-3.99-4z"/>
                    </svg>
                </div>
            </a>
        </main>
        
        <footer class="footer">
            <p style="margin-top: 0.5rem;">联系我们： QQ:1215721590 项目交流群:991547824</p>
        </footer>
    </div>

    <!-- Notification Popup -->
    <div id="notification-popup" class="notification-popup">
        <div class="popup-content">
            <span class="close-btn" onclick="closePopup()">&times;</span>
            <p>原 Openlist 站点已迁移，请访问 <a href="http://10.170.35.57:13830/" target="_blank">http://10.170.35.57:13830/</a> 或点击下方“访问站点”按钮</p>
        </div>
    </div>

    <script>
        function closePopup() {
            const popup = document.getElementById("notification-popup");
            popup.style.opacity = '0';
            setTimeout(() => {
                popup.style.display = "none";
            }, 300);
        }
    </script>
</body>
</html>
