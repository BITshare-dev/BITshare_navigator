<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>BITshare 导航</title>
    <link rel="icon" type="image/svg+xml" href="logo_best.svg">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@100..900&family=Roboto:wght@300;400;500;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="ambient-shapes" aria-hidden="true">
        <span class="ambient-shape ambient-shape-green ambient-shape-circle ambient-shape-one"></span>
        <span class="ambient-shape ambient-shape-green ambient-shape-square ambient-shape-two"></span>
        <span class="ambient-shape ambient-shape-orange ambient-shape-circle ambient-shape-three"></span>
        <span class="ambient-shape ambient-shape-orange ambient-shape-square ambient-shape-four"></span>
        <span class="ambient-shape ambient-shape-green ambient-shape-circle ambient-shape-five"></span>
        <span class="ambient-shape ambient-shape-orange ambient-shape-square ambient-shape-six"></span>
    </div>

    <div class="container">
        <header class="header">
            <div class="logo-container">
                <img src="logo_best.svg" alt="BITshare Logo" class="logo">
                <h1 class="site-title">BITshare</h1>
            </div>
            <p class="site-subtitle">开源 · 共享</p>
        </header>

        <main class="landing-content">
            <a href="https://portal.site-2.teclab.org.cn/?id=site2-bitshare-app" class="main-site-button" target="_blank" rel="noopener noreferrer">
                <span class="main-site-button-label">进入主站</span>
                <svg class="main-site-button-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M5 12h14m-6-6 6 6-6 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
            </a>

        </main>

        <footer class="footer">
            <div class="footer-links" aria-label="页脚快捷入口">
                <button type="button" class="footer-link-btn footer-link-btn-primary" data-popup="dashboard">数据看板</button>
                <span class="footer-divider" aria-hidden="true"></span>
                <button type="button" class="footer-link-btn" data-popup="connection">无法连接？</button>
                <span class="footer-divider" aria-hidden="true"></span>
                <button type="button" class="footer-link-btn" data-popup="contact">联系我们</button>
            </div>
        </footer>
    </div>

    <div id="info-modal" class="info-modal" aria-hidden="true">
        <div class="info-modal-backdrop" data-close-modal></div>
        <div class="info-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="info-modal-title">
            <button type="button" class="info-modal-close" aria-label="关闭弹窗" data-close-modal>&times;</button>
            <div class="info-modal-title-row">
                <h2 id="info-modal-title" class="info-modal-title"></h2>
                <span id="modalUpdatedAt" class="dashboard-modal-updated"></span>
            </div>
            <div id="info-modal-body" class="info-modal-body"></div>
        </div>
    </div>

    <div id="contact-modal" class="info-modal contact-modal" aria-hidden="true">
        <div class="info-modal-backdrop" data-close-contact-modal></div>
        <div class="info-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="contact-modal-title">
            <button type="button" class="info-modal-close" aria-label="关闭弹窗" data-close-contact-modal>&times;</button>
            <div class="info-modal-title-row">
                <h2 id="contact-modal-title" class="info-modal-title">联系我们</h2>
            </div>
            <div class="info-modal-body">
                <p class="info-modal-text">QQ：1215721590<br>QQ群：991547824（邀请码：BITshare）</p>
                <p class="info-modal-text">GitHub 项目组：<a class="info-link-text" href="https://github.com/BITshare-dev" target="_blank" rel="noopener noreferrer">BITshare 项目组</a></p>
                <div class="contact-links-section">
                    <h3>友情链接</h3>
                    <a class="info-link-text" href="https://bit101.cn/" target="_blank" rel="noopener noreferrer">BIT101</a>
                    <a class="info-link-text" href="https://mp.weixin.qq.com/s/HEOoGqcmhksJ9CCAfYfT_A" target="_blank" rel="noopener noreferrer">哔特儿</a>
                </div>
            </div>
        </div>
    </div>

    
    <div id="notification-popup" class="notification-popup">
        <div class="popup-content">
            <button type="button" class="close-btn" onclick="closePopup()" aria-label="关闭公告">&times;</button>
            <p class="popup-heading"><span class="notice-dot" aria-hidden="true"></span>校外也能访问了</p>
            <p>网络配置已升级，点击「进入主站」即可使用。<br>连接遇到问题？可通过底部入口获取帮助。</p>
        </div>
    </div>

    <script>
        function closePopup() {
            const popup = document.getElementById("notification-popup");
            if (popup) {
                popup.style.opacity = '0';
                setTimeout(() => {
                    popup.style.display = "none";
                }, 300);
            }
        }
    </script>

    <script src="dashboard-data.js"></script>

    <script>
        const infoModal = document.getElementById('info-modal');
        const infoModalTitle = document.getElementById('info-modal-title');
        const infoModalBody = document.getElementById('info-modal-body');
        const contactModal = document.getElementById('contact-modal');

        const modalDashboardState = {
            windowStart: null,
            windowDays: 29,
            items: [],
            points: [],
            plot: null,
            hoverBound: false,
            activeIndex: null,
            renderSize: null
        };

        const popupContent = {
            dashboard: {
                title: '数据看板',
                body: `
                    <div class="dashboard-modal-content">
                        <div class="dashboard-modal-summary" aria-label="核心指标">
                            <article class="dashboard-modal-metric dashboard-modal-metric-visits">
                                <span>总浏览量</span>
                                <strong id="modalTotalVisits">0</strong>
                                <small id="modalVisitsDelta"></small>
                            </article>
                            <article class="dashboard-modal-metric dashboard-modal-metric-downloads">
                                <span>总下载量</span>
                                <strong id="modalTotalDownloads">0</strong>
                                <small id="modalDownloadsDelta"></small>
                            </article>
                            <article class="dashboard-modal-metric dashboard-modal-metric-running">
                                <span>已运行</span>
                                <strong><span id="modalRunningDays">0</span><em> 天</em></strong>
                                <small>开源 · 共享</small>
                            </article>
                        </div>
                        <section class="dashboard-modal-panel">
                            <div class="dashboard-modal-panel-heading">
                                <div>
                                    <h3>每日趋势</h3>
                                    <p>最近 29 天数据</p>
                                </div>
                                <div class="dashboard-modal-legend" aria-label="图表图例">
                                    <span><i class="legend-dot visits-dot"></i>浏览量</span>
                                    <span><i class="legend-dot downloads-dot"></i>下载量</span>
                                </div>
                            </div>
                            <div class="dashboard-modal-chart-wrap">
                                <canvas id="modalTrendChart" width="900" height="300" aria-label="每日趋势图"></canvas>
                                <div class="chart-tooltip" id="modalChartTooltip" aria-hidden="true">
                                    <div class="tooltip-date" id="modalTooltipDate"></div>
                                    <div class="tooltip-row">
                                        <span><i class="legend-dot visits-dot"></i>浏览量</span>
                                        <strong id="modalTooltipVisits"></strong>
                                    </div>
                                    <div class="tooltip-row">
                                        <span><i class="legend-dot downloads-dot"></i>下载量</span>
                                        <strong id="modalTooltipDownloads"></strong>
                                    </div>
                                </div>
                            </div>
                            <div class="window-control dashboard-window-control" aria-label="趋势窗口控制">
                                <button type="button" id="modalPrevWindow" aria-label="查看更早数据">
                                    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                                        <path fill="currentColor" d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z" />
                                    </svg>
                                </button>
                                <input type="range" id="modalWindowSlider" min="0" step="1" value="0" aria-label="滑动选择 29 天趋势窗口">
                                <button type="button" id="modalNextWindow" aria-label="查看更新数据">
                                    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                                        <path fill="currentColor" d="M8.59 16.59 13.17 12 8.59 7.41 10 6l6 6-6 6z" />
                                    </svg>
                                </button>
                            </div>
                        </section>
                    </div>
                `
            },
            connection: {
                title: '无法连接？',
                body: `
                    <p class="info-modal-text">如果无法进入主站，请<a href="#" class="info-modal-inline-action" data-open-contact>联系我们</a>。</p>
                    <p class="info-modal-text">如需下载资料，请使用<a class="info-modal-inline-action" href="https://disk.pku.edu.cn/link/AA4F18CD45AE524C948D3E34CB9B7767E9" target="_blank" rel="noopener noreferrer">这个网站</a>。</p>
                `
            },
            contact: {
                title: '联系我们',
                body: `
                    <p class="info-modal-text">QQ：1215721590<br>QQ群：991547824（邀请码：BITshare）</p>
                    <p class="info-modal-text">GitHub 项目组：<a class="info-link-text" href="https://github.com/BITshare-dev" target="_blank" rel="noopener noreferrer">BITshare 项目组</a></p>
                    <div class="contact-links-section">
                        <h3>友情链接</h3>
                        <a class="info-link-text" href="https://bit101.cn/" target="_blank" rel="noopener noreferrer">BIT101</a>
                        <a class="info-link-text" href="https://mp.weixin.qq.com/s/HEOoGqcmhksJ9CCAfYfT_A" target="_blank" rel="noopener noreferrer">哔特儿</a>
                    </div>
                `
            }
        };

        function formatModalNumber(value) {
            return new Intl.NumberFormat('zh-CN').format(value);
        }

        function drawModalArea(ctx, points, baseY, colorStart, colorEnd) {
            if (!points.length) return;

            const gradient = ctx.createLinearGradient(0, points[0].y, 0, baseY);
            gradient.addColorStop(0, colorStart);
            gradient.addColorStop(1, colorEnd);
            ctx.beginPath();
            points.forEach((point, index) => {
                if (index === 0) ctx.moveTo(point.x, point.y);
                else ctx.lineTo(point.x, point.y);
            });
            ctx.lineTo(points[points.length - 1].x, baseY);
            ctx.lineTo(points[0].x, baseY);
            ctx.closePath();
            ctx.fillStyle = gradient;
            ctx.fill();
        }

        function drawModalLine(ctx, points, color) {
            if (!points.length) return;

            ctx.beginPath();
            points.forEach((point, index) => {
                if (index === 0) ctx.moveTo(point.x, point.y);
                else ctx.lineTo(point.x, point.y);
            });
            ctx.strokeStyle = color;
            ctx.lineWidth = 3;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            ctx.stroke();

            points.forEach((point) => {
                ctx.beginPath();
                ctx.arc(point.x, point.y, 4, 0, Math.PI * 2);
                ctx.fillStyle = '#fff';
                ctx.fill();
                ctx.strokeStyle = color;
                ctx.lineWidth = 3;
                ctx.stroke();
            });
        }

        function renderModalDashboard(activeIndex = null) {
            const data = window.BITSHARE_DASHBOARD_DATA;
            const canvas = document.getElementById('modalTrendChart');
            if (!data || !canvas) return;

            const tooltip = document.getElementById('modalChartTooltip');
            if (tooltip && activeIndex === null) {
                tooltip.classList.remove('is-visible');
                tooltip.setAttribute('aria-hidden', 'true');
            }

            const formatNumber = formatModalNumber;
            const recentSum = (days, key) => data.daily.slice(-days).reduce((sum, item) => sum + item[key], 0);
            const runningDays = data.runningDays ?? data.daily.filter((item) => item.visits > 0 || item.downloads > 0).length;
            const maxStart = Math.max(0, data.daily.length - modalDashboardState.windowDays);
            if (modalDashboardState.windowStart === null) {
                modalDashboardState.windowStart = maxStart;
            }
            modalDashboardState.windowStart = Math.max(0, Math.min(modalDashboardState.windowStart, maxStart));

            document.getElementById('modalTotalVisits').textContent = formatNumber(data.totals.visits);
            document.getElementById('modalTotalDownloads').textContent = formatNumber(data.totals.downloads);
            document.getElementById('modalRunningDays').textContent = formatNumber(runningDays);
            document.getElementById('modalVisitsDelta').textContent = `近 7 天 ${formatNumber(recentSum(7, 'visits'))}`;
            document.getElementById('modalDownloadsDelta').textContent = `近 7 天 ${formatNumber(recentSum(7, 'downloads'))}`;
            document.getElementById('modalUpdatedAt').textContent = `更新于 ${data.generatedAt}`;

            const slider = document.getElementById('modalWindowSlider');
            const prevButton = document.getElementById('modalPrevWindow');
            const nextButton = document.getElementById('modalNextWindow');
            const progress = maxStart === 0 ? 100 : (modalDashboardState.windowStart / maxStart) * 100;
            slider.max = String(maxStart);
            slider.value = String(modalDashboardState.windowStart);
            slider.style.setProperty('--range-progress', `${progress}%`);
            prevButton.disabled = modalDashboardState.windowStart <= 0;
            nextButton.disabled = modalDashboardState.windowStart >= maxStart;

            const chartWrap = canvas.parentElement;
            const width = Math.max(240, chartWrap.clientWidth || 900);
            const height = Math.max(220, Math.min(300, width * 0.34));
            const devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = Math.round(width * devicePixelRatio);
            canvas.height = Math.round(height * devicePixelRatio);
            canvas.style.height = `${height}px`;
            const ctx = canvas.getContext('2d');
            ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
            const compactChart = width < 520;
            const padding = {
                top: compactChart ? 24 : 28,
                right: compactChart ? 48 : 72,
                bottom: compactChart ? 36 : 42,
                left: compactChart ? 44 : 56
            };
            const plotWidth = width - padding.left - padding.right;
            const plotHeight = height - padding.top - padding.bottom;
            const items = data.daily.slice(modalDashboardState.windowStart, modalDashboardState.windowStart + modalDashboardState.windowDays);
            const maxVisits = Math.max(1, ...items.map((item) => item.visits));
            const maxDownloads = Math.max(1, ...items.map((item) => item.downloads));
            const pointGap = items.length > 1 ? plotWidth / (items.length - 1) : plotWidth;
            const toPoints = (key, max) => items.map((item, index) => ({
                x: padding.left + index * pointGap,
                y: padding.top + plotHeight - (item[key] / max) * plotHeight
            }));
            const visitPoints = toPoints('visits', maxVisits);
            const downloadPoints = toPoints('downloads', maxDownloads);
            modalDashboardState.activeIndex = activeIndex;
            modalDashboardState.items = items;
            modalDashboardState.points = visitPoints.map((point, index) => ({
                x: point.x,
                visitsY: point.y,
                downloadsY: downloadPoints[index].y
            }));
            modalDashboardState.plot = { padding, plotWidth, plotHeight };
            modalDashboardState.renderSize = { width, height };

            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = '#fbfcfd';
            ctx.fillRect(padding.left, padding.top, plotWidth, plotHeight);
            ctx.font = `${compactChart ? 10 : 12}px Roboto, sans-serif`;
            ctx.textBaseline = 'middle';

            for (let index = 0; index <= 4; index += 1) {
                const y = padding.top + (plotHeight / 4) * index;
                ctx.beginPath();
                ctx.moveTo(padding.left, y);
                ctx.lineTo(width - padding.right, y);
                ctx.strokeStyle = '#e7ecef';
                ctx.lineWidth = 1;
                ctx.stroke();
            }

            drawModalArea(ctx, downloadPoints, padding.top + plotHeight, 'rgba(255, 152, 0, 0.05)', 'rgba(255, 152, 0, 0)');
            drawModalArea(ctx, visitPoints, padding.top + plotHeight, 'rgba(47, 128, 237, 0.05)', 'rgba(47, 128, 237, 0)');
            drawModalLine(ctx, downloadPoints, '#f39c12');
            drawModalLine(ctx, visitPoints, '#2f80ed');

            if (activeIndex !== null && modalDashboardState.points[activeIndex]) {
                const active = modalDashboardState.points[activeIndex];
                ctx.beginPath();
                ctx.moveTo(active.x, padding.top);
                ctx.lineTo(active.x, padding.top + plotHeight);
                ctx.strokeStyle = 'rgba(55, 71, 79, 0.36)';
                ctx.lineWidth = 2;
                ctx.setLineDash([6, 6]);
                ctx.stroke();
                ctx.setLineDash([]);

                [
                    { y: active.downloadsY, color: '#f39c12' },
                    { y: active.visitsY, color: '#2f80ed' }
                ].forEach((dot) => {
                    ctx.beginPath();
                    ctx.arc(active.x, dot.y, 6, 0, Math.PI * 2);
                    ctx.fillStyle = '#fff';
                    ctx.fill();
                    ctx.strokeStyle = dot.color;
                    ctx.lineWidth = 3;
                    ctx.stroke();
                });
            }

            ctx.fillStyle = '#78909c';
            ctx.textAlign = 'right';
            ctx.fillText(formatNumber(maxVisits), padding.left - 10, padding.top);
            ctx.fillText('浏览量', padding.left - 10, padding.top + 22);
            ctx.textAlign = 'left';
            ctx.fillText(formatNumber(maxDownloads), width - padding.right + 10, padding.top);
            ctx.fillText('下载量', width - padding.right + 10, padding.top + 22);
            ctx.textAlign = 'center';
            items.forEach((item, index) => {
                if (index === 0 || index === items.length - 1 || index % 7 === 0) {
                    ctx.fillText(item.day.slice(5), padding.left + index * pointGap, height - 18);
                }
            });

            if (!modalDashboardState.hoverBound) {
                const tooltip = document.getElementById('modalChartTooltip');

                const hideModalTooltip = () => {
                    tooltip.classList.remove('is-visible');
                    tooltip.setAttribute('aria-hidden', 'true');
                };

                canvas.addEventListener('mousemove', (event) => {
                    const rect = canvas.getBoundingClientRect();
                    const position = {
                        x: (event.clientX - rect.left) * (modalDashboardState.renderSize.width / rect.width),
                        y: (event.clientY - rect.top) * (modalDashboardState.renderSize.height / rect.height)
                    };
                    const plot = modalDashboardState.plot;
                    const outsidePlot = position.x < plot.padding.left ||
                        position.x > plot.padding.left + plot.plotWidth ||
                        position.y < plot.padding.top ||
                        position.y > plot.padding.top + plot.plotHeight;

                    if (outsidePlot) {
                        modalDashboardState.activeIndex = null;
                        hideModalTooltip();
                        renderModalDashboard();
                        return;
                    }

                    const nearest = modalDashboardState.points.reduce((result, point, index) => {
                        const distance = Math.abs(point.x - position.x);
                        return distance < result.distance ? { index, distance } : result;
                    }, { index: 0, distance: Infinity });
                    if (nearest.index !== modalDashboardState.activeIndex) {
                        renderModalDashboard(nearest.index);
                    }
                    const point = modalDashboardState.points[nearest.index];
                    const item = modalDashboardState.items[nearest.index];
                    const scaleX = rect.width / modalDashboardState.renderSize.width;
                    const scaleY = rect.height / modalDashboardState.renderSize.height;
                    const tooltipWidth = tooltip.offsetWidth || 210;
                    const tooltipHeight = tooltip.offsetHeight || 112;
                    const canvasX = point.x * scaleX;
                    const canvasY = Math.min(point.visitsY, point.downloadsY) * scaleY;
                    const placeLeft = canvasX + tooltipWidth + 28 > rect.width;
                    const suggestedX = placeLeft ? canvasX - tooltipWidth - 18 : canvasX + 18;
                    const x = Math.max(12, Math.min(suggestedX, rect.width - tooltipWidth - 12));
                    const y = Math.max(12, Math.min(canvasY - tooltipHeight / 2, rect.height - tooltipHeight - 12));

                    document.getElementById('modalTooltipDate').textContent = item.day;
                    document.getElementById('modalTooltipVisits').textContent = formatNumber(item.visits);
                    document.getElementById('modalTooltipDownloads').textContent = formatNumber(item.downloads);
                    tooltip.style.transform = `translate3d(${x}px, ${y}px, 0)`;
                    tooltip.classList.add('is-visible');
                    tooltip.setAttribute('aria-hidden', 'false');
                });

                canvas.addEventListener('mouseleave', () => {
                    modalDashboardState.activeIndex = null;
                    hideModalTooltip();
                    renderModalDashboard(null);
                });
                modalDashboardState.hoverBound = true;
            }

            const updateWindow = (start) => {
                modalDashboardState.windowStart = start;
                modalDashboardState.activeIndex = null;
                renderModalDashboard(null);
            };
            prevButton.onclick = () => updateWindow(modalDashboardState.windowStart - 1);
            nextButton.onclick = () => updateWindow(modalDashboardState.windowStart + 1);
            slider.oninput = (event) => updateWindow(Number(event.target.value));
        }

        let infoModalCloseTimer = null;

        function openInfoModal(key) {
            const content = popupContent[key];
            if (!content) return;

            if (infoModalCloseTimer) {
                clearTimeout(infoModalCloseTimer);
                infoModalCloseTimer = null;
            }
            infoModalTitle.textContent = content.title;
            infoModalBody.innerHTML = content.body;
            infoModal.classList.toggle('dashboard-modal', key === 'dashboard');
            infoModal.classList.add('is-open');
            infoModal.setAttribute('aria-hidden', 'false');
            document.body.classList.add('modal-open');

            if (key === 'dashboard') {
                modalDashboardState.windowStart = null;
                modalDashboardState.hoverBound = false;
                requestAnimationFrame(renderModalDashboard);
            }
        }

        function closeInfoModal() {
            const wasDashboard = infoModal.classList.contains('dashboard-modal');
            infoModal.classList.remove('is-open');
            infoModal.setAttribute('aria-hidden', 'true');
            if (wasDashboard) {
                infoModalCloseTimer = window.setTimeout(() => {
                    if (!infoModal.classList.contains('is-open')) {
                        infoModal.classList.remove('dashboard-modal');
                    }
                    infoModalCloseTimer = null;
                }, 220);
            } else {
                infoModal.classList.remove('dashboard-modal');
            }
            if (!contactModal.classList.contains('is-open')) {
                document.body.classList.remove('modal-open');
            }
        }

        function openContactModal() {
            contactModal.classList.add('is-open');
            contactModal.setAttribute('aria-hidden', 'false');
            document.body.classList.add('modal-open');
        }

        function closeContactModal() {
            contactModal.classList.remove('is-open');
            contactModal.setAttribute('aria-hidden', 'true');
            if (!infoModal.classList.contains('is-open')) {
                document.body.classList.remove('modal-open');
            }
        }

        document.querySelectorAll('[data-popup]').forEach((button) => {
            button.addEventListener('click', () => {
                if (button.dataset.popup === 'contact') {
                    openContactModal();
                    return;
                }
                openInfoModal(button.dataset.popup);
            });
        });

        let dashboardResizeFrame = null;
        window.addEventListener('resize', () => {
            if (!infoModal.classList.contains('dashboard-modal')) return;
            if (dashboardResizeFrame) cancelAnimationFrame(dashboardResizeFrame);
            dashboardResizeFrame = requestAnimationFrame(() => {
                renderModalDashboard(null);
                dashboardResizeFrame = null;
            });
        });

        infoModal.addEventListener('click', (event) => {
            if (event.target.hasAttribute('data-close-modal')) {
                closeInfoModal();
            }

            const contactTrigger = event.target.closest('[data-open-contact]');
            if (contactTrigger) {
                event.preventDefault();
                openContactModal();
            }
        });

        contactModal.addEventListener('click', (event) => {
            if (event.target.hasAttribute('data-close-contact-modal')) {
                closeContactModal();
            }
        });

        document.addEventListener('keydown', (event) => {
            if (event.key !== 'Escape') return;
            if (contactModal.classList.contains('is-open')) {
                closeContactModal();
            } else if (infoModal.classList.contains('is-open')) {
                closeInfoModal();
            }
        });
    </script>
</body>

</html>
